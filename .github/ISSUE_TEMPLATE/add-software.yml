name: "📦 添加软件"
description: "添加新的软件官网链接"
labels: ["新增软件"]
body:
  - type: input
    id: name
    attributes:
      label: 软件名称
      description: 软件的显示名称
      placeholder: "e.g. Firefox"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: 官网地址
      description: 软件的官方网站 URL
      placeholder: "https://www.firefox.com/"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: 名称类型
      description: 软件名称是英文还是中文
      options:
        - 英文 (en)
        - 中文 (zh)
    validations:
      required: true

  - type: input
    id: group
    attributes:
      label: 分组首字母
      description: 根据软件名称的首个字符填写（A-Z 或 0-9），留空则自动取名称首字符
      placeholder: "e.g. F"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 备注
      description: 其他说明（可选）
    validations:
      required: false
